<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizon — quests for the things you avoid</title>

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@snehipratham" />
    <meta name="twitter:creator" content="@snehipratham" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Horizon" />
    <meta property="og:url" content="https://usehorizon.app/" />
    <meta property="og:title" content="Horizon — quests for the things you avoid" />
    <meta property="og:description" content="Tell Horizon what makes you hesitate. It hands back a few quests at real places near you, picked for what you like. iOS, free." />
    <meta property="og:image" content="https://usehorizon.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Horizon app icon and tagline" />

    <!-- Why the block above sits at the very top of <head>:
         Firebase Hosting honours Range requests on HTML, so a crawler fetches only
         a prefix of this document (Facebook's debugger reports a 206). These tags
         previously sat past ~1.1KB, so a crawler reading a short prefix saw the
         <title> and no card tags — which is why X rendered a bare link. Nothing
         long (comments, meta, JSON-LD) may move above them, and a formatter must
         not wrap them onto multiple lines. X falls back to og:title/description/
         image, so the twitter:* duplicates are omitted to keep the block small. -->

    <meta name="description" content="Tell Horizon what makes you hesitate. It hands back a few quests at real places near you, picked for what you like. iOS, free." />
    <meta name="theme-color" content="#FBF8F3" />
    <link rel="canonical" href="https://usehorizon.app/" />

    <!-- favicon.svg (the sunrise mark), the 180² touch icon and the 1200×630
         og.png all ship in /public; the latter two are generated from the
         ignored source image at ../image-originals/appicon.png. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured data for search/link previews. Deliberately no ratings/reviews
         (the app is pre-launch) — only facts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Horizon",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "iOS",
        "description": "Tell Horizon what makes you hesitate. It hands back a few quests at real places near you, picked for what you like.",
        "url": "https://usehorizon.app/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Caveat:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Light pre-paint so the marketing site at `/` shows no flash before React
         mounts (Home.tsx then themes <body>). The admin route reverts to its dark
         dashboard theme on mount. React replaces #root's children, dropping .boot. */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      .boot {
        min-height: 100vh;
        background: #fbf8f3;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
